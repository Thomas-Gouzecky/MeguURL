apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
    name: {{ .Values.ca.bundle.name }}
spec:
    sources:
        - secret:
              name: {{ .Values.ca.certificate.secretName }}
              key: ca.crt

    target:
        configMap:
            key: ca.crt
        namespaceSelector:
            matchLabels:
                trust: enabled
