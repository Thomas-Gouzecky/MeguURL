apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    name: {{ .Values.gateway.name }}
spec:
    gatewayClassName: {{ .Values.gatewayClass.name }}

    listeners:
        - name: http
          protocol: HTTP
          port: 80
          allowedRoutes:
              namespaces:
                  from: Same

        - name: https
          protocol: HTTPS
          port: 443
          tls:
              mode: Terminate
              certificateRefs:
                  - name: {{ .Values.gateway.tlsSecretName }}

          allowedRoutes:
              namespaces:
                  from: Same
