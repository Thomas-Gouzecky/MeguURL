apiVersion: v1
kind: Service
metadata:
    name: {{ .Values.service.name }}
spec:
    type: NodePort
    selector:
        app: {{ .Values.deployment.name }}
    ports:
        - name: dns-udp
          port: 53
          targetPort: {{ .Values.deployment.containerPorts.udp }}
          nodePort: {{ .Values.service.nodePort.udp }}
          protocol: UDP

        - name: dns-tcp
          port: 53
          targetPort: {{ .Values.deployment.containerPorts.tcp }}
          nodePort: {{ .Values.service.nodePort.tcp }}
          protocol: TCP
