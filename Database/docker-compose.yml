services:
    api:
        image: tomcheese/meguurl-db-api-repo:latest
        pull_policy: always
        container_name: meguURL-api
        ports:
            - "8000:8000"
        env_file:
            - .env.prod
        depends_on:
            - database
        networks:
            - megu-network

    database:
        image: postgres:18
        pull_policy: if_not_present
        container_name: meguURL-database
        env_file:
            - .env.db
        volumes:
            - postgres-data:/var/lib/postgresql
        networks:
            - megu-network

volumes:
    postgres-data:

networks:
    megu-network:
