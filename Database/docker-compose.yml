services:
    api:
        image: meguurl-api:prod-v1
        container_name: meguURL-api
        ports:
            - "8000:8000"
        env_file:
            - .env.prod
        depends_on:
            - database
        networks:
            - megu-network

    database:
        image: postgres:18
        container_name: meguURL-database
        env_file:
            - .env.db
        ports:
            - "5431:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        networks:
            - megu-network

volumes:
    postgres-data:

networks:
    megu-network:
