services:
    backend:
        image: tomcheese/meguurl-backend-repo:latest
        pull_policy: always
        container_name: meguURL-backend
        env_file:
            - App/.env.production
        ports:
            - "6767:8080"
        volumes:
            - dataprotection-keys:/keys
        networks:
            - megu-network

    qrcode:
        image: tomcheese/qr-code-generator:latest
        pull_policy: always
        ports:
            - "8001:8000"
        container_name: "qr-code-api"
        networks:
            - megu-network

    redis:
        image: redis:8.10
        container_name: redis
        pull_policy: if_not_present
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 3s
            retries: 15
        volumes:
            - redis-data:/data
        environment:
            - --appendonly yes
        networks:
            - megu-network

volumes:
    redis-data:
        driver: local
    dataprotection-keys:

networks:
    megu-network:
