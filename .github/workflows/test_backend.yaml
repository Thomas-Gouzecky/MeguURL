name: Test Backend

on:
    pull_request:

jobs:
    backend-test:
        runs-on: ubuntu-latest

        steps:
            - name: Check for backend changes
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      backend:
                        - 'Backend/**'

            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  sparse-checkout: Backend

            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "9.0.302"

            - name: Show .NET version
              working-directory: Backend
              run: dotnet --version

            - name: Start QR code service
              working-directory: Backend
              run: docker compose up -d qrcode

            - name: Wait for QR code service
              working-directory: Backend
              shell: bash
              run: |
                  for attempt in {1..30}; do
                    if curl --fail --silent \
                      -H "Content-Type: application/json" \
                      -d '{"data":"https://megu.url","error_correction":"LOW"}' \
                      http://localhost:8001/qrcode/ > /dev/null; then
                        exit 0
                    fi

                    sleep 2
                  done

                  echo "QR code service did not become ready"
                  docker compose logs qrcode
                  exit 1

            - name: Start Redis service
              working-directory: Backend
              run: docker compose up -d redis

            - name: Wait for Redis service
              working-directory: Backend
              shell: bash
              run: |
                  for attempt in {1..30}; do
                    status=$(docker inspect --format='{{.State.Health.Status}}' redis 2>/dev/null || true)
                    if [[ "$status" == "healthy" ]]; then
                        exit 0
                    fi

                    if [[ "$status" == "unhealthy" ]]; then
                        echo "Redis service became unhealthy"
                        docker compose logs redis
                        exit 1
                    fi

                    sleep 2
                  done

                  echo "Redis service did not become ready"
                  docker compose logs redis
                  exit 1

            - name: Restore backend dependencies
              working-directory: Backend
              run: dotnet restore Tests/Tests.csproj

            - name: Run backend tests
              working-directory: Backend
              run: dotnet test Tests/Tests.csproj --configuration Release --no-restore

            - name: Stop QR code service
              if: always()
              run: docker rm --force qr-code-api || true

            - name: Stop Redis service
              if: always()
              run: docker rm --force redis || true
