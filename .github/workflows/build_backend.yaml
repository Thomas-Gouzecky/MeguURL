name: Build Backend Image

on:
    push:
        branches:
            - "main"
        tags:
            - "v*"
        paths:
            - "Backend/App/**"
            - "Backend/Dockerfile"
            - ".github/workflows/build_backend.yaml"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Backend
              uses: actions/checkout@v4
              with:
                  sparse-checkout: Backend

            - name: Get Version
              id: Version
              shell: pwsh
              run: |
                  $version = Select-Xml -Path ./Backend/App/backend.csproj -XPath "//Version" |
                    Select-Object -ExpandProperty Node |
                    Select-Object -ExpandProperty InnerText

                  echo "version=$version" >> $env:GITHUB_OUTPUT

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: ./Backend
                  file: ./Backend/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-backend-repo:${{ steps.version.outputs.version }}
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-backend-repo:latest
