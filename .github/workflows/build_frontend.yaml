name: Build Frontend Image

on:
    workflow_dispatch:
        inputs:
            deployment:
                description: "Which frontend image should be built?"
                required: true
                type: choice
                options:
                    - local
                    - k8s

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Frontend
              uses: actions/checkout@v4

            - name: Get Version
              id: Version
              working-directory: Frontend
              run: |
                  echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Set build configuration
              id: config
              run: |
                  if [ "${{ inputs.deployment }}" = "k8s" ]; then
                      echo "backend_url=" >> "$GITHUB_OUTPUT"
                      echo "image_suffix=k8s" >> "$GITHUB_OUTPUT"
                  else
                      echo "backend_url=http://localhost:6767" >> "$GITHUB_OUTPUT"
                      echo "image_suffix=local" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: ./Frontend
                  push: true
                  build-args: |
                      NEXT_PUBLIC_BACKEND=${{ steps.config.outputs.backend_url }}
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-frontend-repo:${{ steps.version.outputs.version }}-${{ steps.config.outputs.image_suffix }}
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-frontend-repo:${{ steps.config.outputs.image_suffix }}
