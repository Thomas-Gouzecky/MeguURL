name: Build Frontend Image

on:
    workflow_dispatch:
        inputs:
            deployment:
                description: "Which frontend image should be built?"
                required: true
                type: choice
                options:
                    - local
                    - k8s
                    - both

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Frontend
              uses: actions/checkout@v4

            - name: Get Version
              id: Version
              working-directory: Frontend
              run: |
                  echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build Local Image
              if: inputs.deployment == 'local' || inputs.deployment == 'both'
              uses: docker/build-push-action@v6
              with:
                  context: ./Frontend
                  push: true
                  build-args: |
                      NEXT_PUBLIC_BACKEND=http://localhost:6767
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-frontend-repo:${{ steps.version.outputs.version }}-local
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-frontend-repo:local

            - name: Build Kubernetes Image
              if: inputs.deployment == 'k8s' || inputs.deployment == 'both'
              uses: docker/build-push-action@v6
              with:
                  context: ./Frontend
                  push: true
                  build-args: |
                      NEXT_PUBLIC_BACKEND=https://api.meguurl.local
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-frontend-repo:${{ steps.version.outputs.version }}-k8s
                      ${{ secrets.DOCKER_USERNAME }}/meguurl-frontend-repo:k8s
