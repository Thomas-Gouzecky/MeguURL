apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
spec:
    serviceName: db-service
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:18
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 5432
                        name: postgres
                  envFrom:
                      - secretRef:
                            name: db-secrets
                  volumeMounts:
                      - name: postgres-storage
                        mountPath: /var/lib/postgresql
    volumeClaimTemplates:
        - metadata:
              name: postgres-storage
          spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                  requests:
                      storage: 10Gi
              storageClassName: standard
